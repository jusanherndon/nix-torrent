# One-shot: updates PR #13 description then no-op on later paths.
# Safe to delete after Actions run completes.
name: update-pr-13-description
on:
  push:
    branches: [fix/connect-path-backlog-12]
    paths:
      - .github/workflows/update-pr-13-description.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Edit PR title and body
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 13,
              title: "Connect-path fix backlog from live diagnosis (#12)",
              body: "## Summary\n- Ships ordered backlog items 1\u20134 for **#12** ([Connect-path fix backlog from live diagnosis](https://github.com/jusanherndon/nix-torrent/issues/12)): HTTP(S) tracker `User-Agent`, `show.connect_diagnostics` per-stage counters, metadata dial timeout/batch strategy, and announce packing (`numwant`/`key`).\n- Documents **Live Swarm Probe** procedure and public redaction rules in `CONTEXT.md` so every future live test posts diagnosis only (IPs, tracker names/URLs, content ids, paths redacted).\n- Leaves MSE residual interop and DHT get_peers polish deferred until a live retest shows whether dial Timeout mass still dominates.\n- Advances operator counters from [#9](https://github.com/jusanherndon/nix-torrent/issues/9) on `show`.\n\nCloses #12\n\n## Test plan\n- [x] `zig build test` (full suite)\n- [ ] Live public magnet probe **following CONTEXT.md Live Swarm Probe procedure** (redacted write-up)\n- [ ] Trackers no longer reject for missing user agent (redacted scheme + status only)\n- [ ] `torrent show <hash>` includes `connect_diagnostics` with non-zero `attempts` while fetching metadata\n- [ ] Stage mix vs prior probe (fewer pure Timeouts / any `handshake_ok`)\n",
            });
            console.log("Updated PR #13");
